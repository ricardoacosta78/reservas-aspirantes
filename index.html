<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Clases - Aspirantes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #667eea; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
        .form-container { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #667eea; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 1.1em; }
        input, select { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; transition: border-color .3s; }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; transition: background .3s, transform .2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, .4); }
        .reserva-card { background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%); padding: 20px; border-radius: 12px; margin-bottom: 15px; animation: slideIn 0.5s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .reserva-nombre { font-size: 1.3em; font-weight: 700; color: #667eea; margin-bottom: 8px; }
        .reserva-detalles { color: #666; font-size: 1em; line-height: 1.6; }
        .reserva-fecha { background: #667eea; color: #fff; padding: 8px 15px; border-radius: 20px; font-size: .9em; font-weight: 600; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; display: none; }
        .success { background: #4caf50; color: #fff; }
        .error { background: #f44336; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Reserva de Clases para Aspirantes</h1>
        <p class="subtitle">Sistema de reservas en tiempo real - Ricardo Acosta</p>
        <div class="message" id="message"></div>
        <div class="form-container">
            <div class="form-group">
                <label for="nombre">Nombre del Aspirante</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre">
            </div>
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ingresa tu correo">
            </div>
            <div class="form-group">
                <label for="fecha">Fecha de la Clase</label>
                <input type="date" id="fecha">
            </div>
            <div class="form-group">
                <label for="hora">Hora de la Clase</label>
                <select id="hora">
                    <option value="">Selecciona una hora</option>
                    <option value="08:00">08:00</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                    <option value="18:00">18:00</option>
                </select>
            </div>
            <button onclick="reservarClase()">Reservar Clase</button>
        </div>
        <h2>📅 Próximas Reservas</h2>
        <div id="reservas-container"></div>
    </div>
    <script type="module">
        // Configuración de Firebase con storageBucket corregido
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "reservas---aspirantes.firebaseapp.com",
            projectId: "reservas---aspirantes",
            storageBucket: "reservas---aspirantes.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Reservar clase
        async function reservarClase() {
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;

            if (!nombre || !correo || !fecha || !hora) {
                mostrarMensaje('error', 'Por favor, completa todos los campos.');
                return;
            }

            try {
                await addDoc(collection(db, 'reservas'), {
                    nombre,
                    correo,
                    fecha,
                    hora,
                    timestamp: new Date()
                });
                mostrarMensaje('success', '¡Reserva realizada con éxito!');
                document.getElementById('nombre').value = '';
                document.getElementById('correo').value = '';
                document.getElementById('fecha').value = '';
                document.getElementById('hora').value = '';
            } catch (error) {
                console.error('Error al reservar clase:', error);
                mostrarMensaje('error', 'Ocurrió un error al realizar la reserva.');
            }
        }

        // Mostrar mensaje
        function mostrarMensaje(tipo, mensaje) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${tipo}`;
            messageDiv.textContent = mensaje;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Mostrar reservas en tiempo real
        const reservasContainer = document.getElementById('reservas-container');
        const reservasQuery = query(collection(db, 'reservas'), orderBy('timestamp', 'asc'));
        onSnapshot(reservasQuery, (snapshot) => {
            reservasContainer.innerHTML = '';
            snapshot.forEach((doc) => {
                const reserva = doc.data();
                const reservaCard = document.createElement('div');
                reservaCard.className = 'reserva-card';
                reservaCard.innerHTML = `
                    <div class="reserva-nombre">${reserva.nombre}</div>
                    <div class="reserva-detalles">${reserva.correo}</div>
                    <div class="reserva-fecha">${reserva.fecha} - ${reserva.hora}</div>
                `;
                reservasContainer.appendChild(reservaCard);
            });
        });
    </script>
</body>
</html>
